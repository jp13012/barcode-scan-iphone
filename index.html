<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Terminal Scanner Mobiel</title>
<link rel="stylesheet" href="style.css">

<!-- ZXing barcode scanner -->
<script src="https://unpkg.com/@zxing/library@latest"></script>
<!-- SheetJS voor Excel/CSV import/export -->
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

</head>
<body>

<h1>Terminal Scanner</h1>

<!-- Excel / CSV / ODS upload -->
<input type="file" id="fileInput" accept=".xlsx,.xls,.ods,.csv">
<br><br>

<!-- Handmatige input fallback -->
<input id="input" placeholder="Scan barcode (handmatig)" disabled>
<br><br>

<!-- Start camera knop voor iOS / mobiele compatibiliteit -->
<button id="startCameraBtn">Start Camera</button>

<!-- Camera scanner -->
<div id="reader" style="width:100%; max-width:400px; height:300px; margin:auto; padding-top:20px;"></div>

<!-- Voortgang en export -->
<div class="box">
    <h2 id="status">Upload Excel / CSV bestand</h2>
    <h3 id="counter">0 / 0</h3>
    <progress id="progress" value="0" max="100" style="width:80%"></progress>
    <br><br>
    <button id="exportBtn" disabled>Export lijst</button>
</div>

<script src="script.js"></script>
</body>
</html>
